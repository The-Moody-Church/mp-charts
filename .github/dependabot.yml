version: 2
updates:
  # Maintain GitHub Actions used in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # One PR for all action bumps instead of one per action.
      actions:
        patterns:
          - "*"

  # Maintain Docker base images (updates node:24-alpine)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # A Node major is a deliberate change: .nvmrc, the four FROM tags,
      # @types/node, engines.node and REQUIRED_NODE_VERSION move together in one
      # commit (CLAUDE.md, "Node Runtime"). Node 24 is security-supported to
      # 2028-04-30.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Maintain npm dependencies (updates package.json and package-lock.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Cap concurrent PRs so a backlog is visible rather than silently truncated.
    open-pull-requests-limit: 10
    ignore:
      # better-auth minors are breaking in practice: 1.7 removed our sign-in
      # client plugin (genericOAuthClient), moved the OAuth callback path (a
      # redirect-URI change on MP's TM.Widgets client), flipped PKCE on by
      # default and moved provider discovery to boot time. Take minors and
      # majors deliberately, in a branch with a live sign-in soak. Patches
      # still arrive normally. (The package.json range `<1.8.0` is the other
      # half of this hold.)
      - dependency-name: "better-auth"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      # Security updates get their OWN group, separate from routine version
      # bumps. Previously a single `patterns: ["*"]` minor-and-patch group
      # swallowed everything, so a superseding group PR would orphan the
      # individual security PRs — #150, #169 and #182 all died that way
      # (#182's closing comment: "js-yaml is no longer updatable, so this is
      # no longer needed"). Security fixes must not be collateral of a
      # routine-bump rebase.
      security:
        applies-to: security-updates
        patterns:
          - "*"

      # better-auth patches get their own PR. Groups match in order, so this must
      # come before prod-minor-patch. Auth changes go to all four apps together,
      # each with a live sign-in soak (workspace CLAUDE.md, "The Better Auth
      # family"); bundling one with routine bumps would hide it.
      better-auth:
        applies-to: version-updates
        patterns:
          - "better-auth"
          - "@better-auth/*"

      # eslint-config-next 16.4.x fails lint in the sibling apps (react-hooks
      # rules), so it needs code changes of its own. Kept apart so it cannot block
      # the rest of the dev group. Also before dev-minor-patch.
      eslint-config-next:
        applies-to: version-updates
        patterns:
          - "eslint-config-next"
          - "@next/eslint-plugin-next"

      # Routine version updates, split prod vs dev so a runtime bump is never
      # buried in a pile of tooling churn and can be reviewed on its own risk.
      prod-minor-patch:
        applies-to: version-updates
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      dev-minor-patch:
        applies-to: version-updates
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
