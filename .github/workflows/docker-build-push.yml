name: Build, Scan, and Push Docker Image

on:
  push:
    branches:
      - '**'

jobs:
  security-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check for unsanitized .join() in filter parameters
        run: |
          # Find .join( on lines containing "filter:" (MP API parameter) in TypeScript
          # source files, excluding the sanitize utility itself and ignore comments.
          # The colon distinguishes MP filter: params from JS Array.filter() chains.
          MATCHES=$(grep -rn 'filter:.*\.join(\|\.join(.*filter:' src/ \
            --include='*.ts' --include='*.tsx' \
            | grep -v 'filter-sanitize' \
            | grep -v 'filter-safety-ignore' \
            || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Unsanitized .join() found in filter parameters. Use sanitizeIds() from filter-sanitize.ts instead."
            echo ""
            echo "$MATCHES"
            echo ""
            echo "If this is a false positive, add '// filter-safety-ignore' on the same line."
            exit 1
          fi
          echo "No unsanitized .join() in filter parameters."

      - name: Check for unsanitized IN (${...}) interpolation in filters
        run: |
          # OData IN(...) clauses map to SQL IN(...) — the interpolated value MUST be
          # built by sanitizeIds()/sanitizeIdsOptional(). Flag any `IN (${...})` whose
          # expression doesn't call a sanitize* helper. (Single-value `= ${id}` sinks
          # are validated via sanitizeId at the service boundary — not grep-checkable
          # here because they're commonly sanitized by parameter reassignment.)
          MATCHES=$(grep -rnE 'IN \(\$\{' src/ \
            --include='*.ts' --include='*.tsx' \
            | grep -v 'sanitize' \
            | grep -v 'filter-safety-ignore' \
            || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Unsanitized IN (\${...}) found in a filter. Build the list with sanitizeIds()/sanitizeIdsOptional() from filter-sanitize.ts."
            echo ""
            echo "$MATCHES"
            echo ""
            echo "If this is a false positive, add '// filter-safety-ignore' on the same line."
            exit 1
          fi
          echo "No unsanitized IN (\${...}) in filter parameters."

  build-scan-and-push:
    needs: security-lint
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitLab Container Registry
        uses: docker/login-action@v4
        with:
          registry: registry.gitlab.com
          username: ${{ secrets.GITLAB_DEPLOY_USERNAME }}
          password: ${{ secrets.GITLAB_DEPLOY_TOKEN }}

      - name: Build and push with SHA tag
        id: build_and_push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: registry.gitlab.com/moodychurch/mp-charts:${{ github.sha }}
          cache-from: type=registry,ref=registry.gitlab.com/moodychurch/mp-charts:buildcache
          cache-to: type=registry,ref=registry.gitlab.com/moodychurch/mp-charts:buildcache,mode=max

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'registry.gitlab.com/moodychurch/mp-charts:${{ github.sha }}'
          format: 'table'
          exit-code: '1'  # Fail build on CRITICAL/HIGH vulnerabilities
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push `dev` tag
        # Every successful build (any branch) becomes the testing image. Pull
        # `:dev` on the docker host to test branch builds before merging the PR.
        run: |
          docker buildx imagetools create registry.gitlab.com/moodychurch/mp-charts:${{ github.sha }} --tag registry.gitlab.com/moodychurch/mp-charts:dev

      - name: Push `latest` and `main` tags
        # Stable tags — only updated by main pushes (i.e. merged PRs).
        if: github.ref == 'refs/heads/main'
        run: |
          docker buildx imagetools create registry.gitlab.com/moodychurch/mp-charts:${{ github.sha }} \
            --tag registry.gitlab.com/moodychurch/mp-charts:latest \
            --tag registry.gitlab.com/moodychurch/mp-charts:main
