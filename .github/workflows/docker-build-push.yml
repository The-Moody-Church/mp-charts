name: Build, Scan, and Push Docker Image

on:
  push:
    branches:
      - '**'

# Runs for the same ref queue instead of racing. Without this, two merges to
# main seconds apart built in parallel and whichever run FINISHED last set
# `:latest` — on 2026-09-25 that was the older commit, in three of the four
# sibling apps.
#
# Keyed on workflow + ref, so every branch is its own queue: a push to one
# branch never waits behind another branch or behind main. (`:dev` is therefore
# still last-finisher-wins ACROSS branches — single-tenant by design, see the
# `Push dev tag` step. Serializing all branches would make every push wait on
# every other branch's full build.)
#
# cancel-in-progress: false, so a build is never killed halfway through a
# push. GitHub keeps at most one RUNNING and one PENDING run per group, and a
# newer run cancels whichever run is still pending. After a burst of merges the
# running build finishes, the NEWEST commit builds next, and `:latest` ends on
# it. The commits in between show as cancelled and never get a `:<sha>` image.
# That is intended. Do not re-run one of them on main: it would retag
# `:latest` back to the older commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check for unsanitized .join() in filter parameters
        run: |
          # Find .join( on lines containing "filter:" (MP API parameter) in TypeScript
          # source files, excluding the sanitize utility itself and ignore comments.
          # The colon distinguishes MP filter: params from JS Array.filter() chains.
          MATCHES=$(grep -rn 'filter:.*\.join(\|\.join(.*filter:' src/ \
            --include='*.ts' --include='*.tsx' \
            | grep -v 'filter-sanitize' \
            | grep -v 'filter-safety-ignore' \
            || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Unsanitized .join() found in filter parameters. Use sanitizeIds() from filter-sanitize.ts instead."
            echo ""
            echo "$MATCHES"
            echo ""
            echo "If this is a false positive, add '// filter-safety-ignore' on the same line."
            exit 1
          fi
          echo "No unsanitized .join() in filter parameters."

      # NOTE: a broader lint for `= ${id}` / `IN (${ids})` filter interpolation was
      # evaluated and intentionally NOT added. The codebase sanitizes by assignment
      # (`const safeIds = sanitizeIds(...)` then `IN (${safeIds})`) and by parameter
      # reassignment (`id = sanitizeId(id)` then `Col = ${id}`), and interpolates
      # server-controlled config/constants/dates — none of which a line-oriented grep
      # can distinguish from raw client input, so it produces false positives on safe
      # code. Those sinks are guarded at the service boundary via sanitizeId/sanitizeIds
      # (see .claude/rules/security.md) and code review instead.

  # Everything that does NOT need repository secrets. Runs for every actor,
  # including dependabot[bot] — which is the point: until this job existed,
  # `build-scan-and-push` was skipped wholesale for Dependabot (see #152), so
  # bot PRs merged with no npm audit, no build, no tests and no image scan.
  # Nothing here touches the registry, so there is no reason to gate it.
  verify:
    needs: security-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails on any HIGH or CRITICAL advisory, like the `--audit-level=high`
      # call it replaced, except advisories in scripts/audit-allowlist.json —
      # and only when EVERY root advisory behind a vulnerability is listed.
      # Retries an audit-endpoint outage (3 attempts) and fails if it persists;
      # never passes on an error. See .claude/rules/security.md, "npm audit gate".
      - name: Audit npm dependencies
        run: node scripts/audit-gate.mjs

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test:run

      # No env is required: nothing reads MP credentials at build time, and
      # NEXT_SERVER_ACTIONS_ENCRYPTION_KEY is optional. Next generates a
      # throwaway key here, as it does for the image build below; the image that
      # ships is built again in `build-scan-and-push` with the real, stable key.
      - name: Build
        run: npm run build

      # A nonce CSP and Next's prerendered shells are mutually exclusive: a
      # shell built at `next build` has no request, so its script tags get no
      # nonce and are blocked once CSP_ENFORCE is on. The failure is silent —
      # the app builds, renders and tests green either way — so it is gated
      # here, against the actual build output. See src/app/layout.tsx.
      - name: Check prerendered shells carry no scripts
        run: npm run check:shells

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Deliberately NO `secrets:` here. This job runs for Dependabot, which
      # cannot read repository secrets, and it only proves the image builds and
      # scans clean. Without the secret the Dockerfile's `if [ -f … ]` falls
      # through and Next uses a throwaway key. Its layers go to the GHA cache,
      # which `build-scan-and-push` never reads, so a keyless layer cannot leak
      # into the shipped image.
      - name: Build image locally (no push — no secrets needed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: mp-charts:ci-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            church.moody.run-id=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Always rebuild the runner stage so its `apk upgrade` sees today's
          # Alpine security fixes — a cached layer pins old packages and fails
          # the Trivy gate once a new CVE lands (CVE-2026-14456, 2026-09-01).
          no-cache-filters: runner

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'mp-charts:ci-${{ github.sha }}'
          format: 'table'
          exit-code: '1'  # Fail on CRITICAL/HIGH
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # Registry login + push. This is the only part that needs secrets
  # (GITLAB_DEPLOY_USERNAME / GITLAB_DEPLOY_TOKEN and the stable
  # NEXT_SERVER_ACTIONS_ENCRYPTION_KEY), and Dependabot runs cannot read
  # repository secrets, so the actor gate stays here and ONLY here.
  build-scan-and-push:
    needs: verify
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Require NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
        # Fail before building if the repository secret is missing (see
        # DOCKER.md, "Server Actions encryption key"). Nothing else would fail:
        # build-push-action drops an empty secret with only a warning, and the
        # keyless `npm run build` layer would be written to the registry
        # :buildcache. BuildKit leaves secret values out of the cache key, so
        # the main build of the same tree (a merge commit usually has the
        # branch head's tree) would reuse that layer and ship a throwaway key.
        #
        # Tests the value, never prints it. The step-level `if:` repeats the
        # job's Dependabot gate on purpose, so moving this step can't make
        # Dependabot runs (which cannot read Actions secrets) fail here.
        # Ported from music-tools; event-manager and mp-senior-care have none.
        if: github.actor != 'dependabot[bot]'
        env:
          SA_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
        run: |
          if [ -z "$SA_KEY" ]; then
            echo "::error::Repository secret NEXT_SERVER_ACTIONS_ENCRYPTION_KEY is not set. Refusing to build: a keyless build layer would be cached in :buildcache and reused by the main build of the same tree."
            exit 1
          fi

      - name: Login to GitLab Container Registry
        uses: docker/login-action@v4
        with:
          registry: registry.gitlab.com
          username: ${{ secrets.GITLAB_DEPLOY_USERNAME }}
          password: ${{ secrets.GITLAB_DEPLOY_TOKEN }}

      - name: Build and push with SHA tag
        id: build_and_push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: registry.gitlab.com/moodychurch/mp-charts:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            church.moody.run-id=${{ github.run_id }}
          cache-from: type=registry,ref=registry.gitlab.com/moodychurch/mp-charts:buildcache
          cache-to: type=registry,ref=registry.gitlab.com/moodychurch/mp-charts:buildcache,mode=max
          # Same runner-stage rebuild as `verify` — the registry buildcache never
          # expires, so without this the pushed image keeps stale OS packages even
          # when verify's (evictable) GHA cache rebuilt them and passed its scan.
          no-cache-filters: runner
          # Stable Server Actions key, so action IDs survive a redeploy (see the
          # Dockerfile builder stage and DOCKER.md). Build time only: the image
          # carries it, so the runtime env does not need it. If the repository
          # secret were unset, the line would resolve to
          # `NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=`; build-push-action would log
          # the warning "… is not a valid secret", skip it, and the image would
          # get a throwaway per-build key with the build still green. The
          # "Require NEXT_SERVER_ACTIONS_ENCRYPTION_KEY" step above stops the
          # run before it gets here. A secret change does NOT invalidate the
          # cached `npm run build` layer: an unchanged Docker context reuses
          # the layer built with the old key (or none).
          secrets: |
            NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'registry.gitlab.com/moodychurch/mp-charts:${{ github.sha }}'
          format: 'table'
          exit-code: '1'  # Fail build on CRITICAL/HIGH vulnerabilities
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push `dev` tag
        # Branch builds ONLY. `:dev` is the production soak slot: /deploy-dev
        # swaps the real `mpcharts` container onto this image so a PR can be
        # exercised against production before it merges.
        #
        # The `if:` is load-bearing. Without it every push to main also
        # overwrote `:dev`, so the tag never held a pre-merge build long enough
        # to test — the moment anything merged, `:dev` silently became `:latest`
        # and a soak deploy was a no-op. Found and fixed first in mp-senior-care
        # (its PR #143, 2026-09-04), where all three tags were observed pointing
        # at one manifest; this repo had the identical defect.
        #
        # Single-tenant by design: the most recent branch push wins. Check what
        # `:dev` currently holds with
        #   docker image inspect …:dev --format '{{index .Config.Labels "org.opencontainers.image.version"}}'
        if: github.ref != 'refs/heads/main'
        run: |
          docker buildx imagetools create registry.gitlab.com/moodychurch/mp-charts:${{ github.sha }} --tag registry.gitlab.com/moodychurch/mp-charts:dev

      - name: Push `latest` and `main` tags
        # Stable tags — only updated by main pushes (i.e. merged PRs).
        if: github.ref == 'refs/heads/main'
        run: |
          docker buildx imagetools create registry.gitlab.com/moodychurch/mp-charts:${{ github.sha }} \
            --tag registry.gitlab.com/moodychurch/mp-charts:latest \
            --tag registry.gitlab.com/moodychurch/mp-charts:main
